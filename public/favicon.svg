<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="8" />
  
  <!-- Glowing Crescent Moon -->
  <path d="M280 110 C 200 110 140 170 140 250 C 140 330 200 390 280 390 C 250 360 230 310 230 250 C 230 190 250 140 280 110 Z" fill="url(#iconGrad)" filter="url(#glow)" />
  
  <!-- Ergonomic Wave Accent Line -->
  <path d="M 120 340 Q 200 290 280 330 T 400 310" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />
</svg>